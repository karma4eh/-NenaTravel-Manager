<!-- PWA & Native Android Experience (Karma Studio) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/static/core/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viajes Nena">
<meta name="theme-color" content="#0a1b2d">
<link rel="icon" type="image/png" sizes="192x192" href="/static/core/icon-192.png">
<link rel="apple-touch-icon" href="/static/core/icon-192.png">

<!-- Mobile App Native Styling & Navigation -->
<link rel="stylesheet" href="/static/core/mobile-app.css">
<script src="/static/core/mobile-app.js" defer></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/static/core/sw.js')
        .catch(err => console.log('ServiceWorker error:', err));
    });
  }

  // Capturar evento de instalacion en Android
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const btnInstalar = document.getElementById('btn-pwa-install');
    if (btnInstalar) {
      btnInstalar.classList.remove('d-none');
      btnInstalar.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          deferredPrompt = null;
          btnInstalar.classList.add('d-none');
        }
      });
    }
  });
</script>
