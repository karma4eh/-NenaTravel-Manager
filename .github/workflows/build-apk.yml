name: Compilar APK Android (Karma Studio)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK Debug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Preparar archivo APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/ViajesNena-v1.0.0.apk \;
          ls -lh build-output/

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ViajesNena-Android-APK
          path: build-output/ViajesNena-v1.0.0.apk
          retention-days: 30
