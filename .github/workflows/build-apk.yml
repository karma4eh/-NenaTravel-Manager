name: Compilar APK Android (Karma Studio)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug

      - name: Renombrar APK para distribucion
        run: |
          mkdir -p build-output
          cp $(find android/app/build/outputs/apk -name "*.apk" | head -n 1) build-output/ViajesNena-v1.0.0.apk || cp $(find . -name "*.apk" | head -n 1) build-output/ViajesNena-v1.0.0.apk
          ls -lh build-output/

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ViajesNena-Android-APK
          path: build-output/ViajesNena-v1.0.0.apk
          retention-days: 30
